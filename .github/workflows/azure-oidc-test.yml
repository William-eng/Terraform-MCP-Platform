name: Azure OIDC Authentication Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  azure-auth:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: |
          az account show \
            --query "{subscription:name, state:state}" \
            --output table
